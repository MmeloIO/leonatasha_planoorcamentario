<meta charset="utf-8">

<title>Relatório confidencial · Grão</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1426;--card:#101C35;--border:#2A3F68;--gold:#C9A84C;--gold-l:#E8C872;--text:#F0F0EC;--muted:#7C879E;--danger:#EF4444}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;top:-120px;right:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.10) 0%,transparent 70%)}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.card{position:relative;width:100%;max-width:400px;background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:36px 32px;animation:fadeUp .6s ease both}
.card.err{animation:shake .35s ease}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-l);border:.5px solid var(--border);padding:5px 12px;border-radius:20px;background:rgba(201,168,76,.06);margin-bottom:24px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold-l)}
.lock{width:44px;height:44px;border-radius:50%;border:.5px solid var(--border);background:rgba(201,168,76,.08);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:30px;line-height:1.1;margin:0 0 6px}
p.sub{font-size:13px;color:var(--muted);margin:0 0 26px;line-height:1.5}
label{display:block;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#7486AD;margin-bottom:8px}
input{width:100%;font:inherit;font-size:16px;color:var(--text);background:#0B1426;border:.5px solid var(--border);border-radius:8px;padding:12px 14px;outline:none}
input:focus{border-color:var(--gold)}
button{width:100%;margin-top:14px;font:inherit;font-size:14px;font-weight:500;color:#0B1426;background:var(--gold);border:none;border-radius:8px;padding:12px;cursor:pointer}
button:hover{background:var(--gold-l)}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;font-size:13px;margin:12px 0 0;color:var(--danger)}
.sig{font-size:12px;color:var(--muted);margin:24px 0 0;text-align:center}
.sig b{color:var(--gold);font-weight:500}
</style>
</head>

    const salt=b64(P.salt),iv=b64(P.iv),mac=b64(P.mac),ct=b64(P.ct);
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveBits']);
    const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:P.it,hash:'SHA-256'},base,512));
    const hk=await crypto.subtle.importKey('raw',bits.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
    const data=new Uint8Array(iv.length+ct.length);data.set(iv);data.set(ct,iv.length);
    if(!await crypto.subtle.verify('HMAC',hk,mac,data)){fail('Senha incorreta. Tente novamente.');return}
    const ek=await crypto.subtle.importKey('raw',bits.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
    const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv},ek,ct));
    document.open();document.write(html);document.close();
  }catch(err){fail('Não foi possível abrir o relatório. Tente novamente.')}
});
</script>
</body>
</html>
